name: CI de la API

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: us-east-2
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  DJANGO_SECRET_KEY: ci-only-not-for-production
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

jobs:
  validate:
    name: Pruebas, calidad y escaneo de imagen
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install --requirement requirements.txt --requirement requirements-dev.txt

      - name: Revisar estilo y errores comunes
        run: ruff check .

      - name: Análisis estático de seguridad
        run: bandit --quiet --recursive api demo --severity-level high

      - name: Auditar dependencias
        run: pip-audit --requirement requirements.txt --requirement requirements-dev.txt

      - name: Ejecutar pruebas unitarias y verificar cobertura
        run: |
          coverage run --branch --source=api --omit="api/migrations/*,api/tests.py" manage.py test --noinput
          coverage report --fail-under=85
          coverage xml -o coverage.xml

      - name: Construir imagen Docker
        run: docker build --pull --tag "devsu-python-api:git-${GITHUB_SHA}" .

      - name: Escanear imagen con Trivy
        run: |
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            "devsu-python-api:git-${GITHUB_SHA}"

  publish:
    name: Publicar imagen en Amazon ECR
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.ECR_REPOSITORY_URI != ''
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirmar configuración de publicación
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          test -n "${AWS_ROLE_ARN}"
          test -n "${ECR_REPOSITORY_URI}"

      - name: Reconstruir y volver a escanear la imagen aprobada
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          IMAGE_TAG="git-${GITHUB_SHA}"
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker build --pull --tag "${ECR_REPOSITORY_URI}:${IMAGE_TAG}" .
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"

      - name: Obtener credenciales temporales de AWS con OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: api-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Iniciar sesión en ECR y publicar
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          IMAGE_TAG="git-${GITHUB_SHA}"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          docker push "${ECR_REPOSITORY_URI}:${IMAGE_TAG}"
